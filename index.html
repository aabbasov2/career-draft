<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Career Draft — Coming Soon</title>
<meta name="description" content="A new kind of job board for early-career talent. Every listing comes with a match score for your CV." />
<meta name="theme-color" content="#0A0C10" />

<!-- Open Graph -->
<meta property="og:title" content="Career Draft — Coming Soon" />
<meta property="og:description" content="Jobs, with your odds. A new kind of job board for early-career talent." />
<meta property="og:type" content="website" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Inter+Tight:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0A0C10;
    --emerald: #43B581;
    --text: #f5f5f5;
    --text-muted: #a3a3a3;
    --text-dim: #737373;
    --text-faint: #525252;
  }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter Tight', ui-sans-serif, system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  ::selection { background: rgba(67,181,129,0.3); color: #d1fae5; }

  .font-display {
    font-family: 'Fraunces', ui-serif, Georgia, serif;
    font-optical-sizing: auto;
  }
  .font-mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }

  /* Layout */
  .page {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* Background atmosphere */
  .grid-bg {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 75%);
    mask-image: radial-gradient(ellipse 70% 60% at 50% 40%, black 30%, transparent 75%);
  }

  .glow {
    position: absolute;
    top: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 900px;
    height: 900px;
    border-radius: 50%;
    pointer-events: none;
    opacity: 0.5;
    background: radial-gradient(circle, rgba(67,181,129,0.18) 0%, rgba(67,181,129,0) 60%);
  }

  /* Header */
  header {
    position: relative;
    z-index: 10;
    padding: 32px 24px 0;
  }
  .header-inner {
    max-width: 1024px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .logo-mark {
    width: 28px;
    height: 28px;
    border-radius: 6px;
    background: var(--emerald);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    color: #0a0a0a;
    font-size: 14px;
    line-height: 1;
  }
  .logo-name {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 17px;
    letter-spacing: -0.01em;
  }
  .est {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    color: var(--text-faint);
  }

  /* Main */
  main {
    position: relative;
    z-index: 10;
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 24px;
  }
  .container {
    max-width: 640px;
    width: 100%;
    text-align: center;
  }

  /* Eyebrow pill */
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    font-size: 12.5px;
    color: #d4d4d4;
    margin-bottom: 40px;
  }
  .pulse-wrap {
    position: relative;
    display: inline-flex;
    width: 6px;
    height: 6px;
  }
  .pulse-outer {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--emerald);
    opacity: 0.75;
    animation: pulse-dot 1.8s ease-in-out infinite;
  }
  .pulse-inner {
    position: relative;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--emerald);
  }
  .eyebrow-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11.5px;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--text-muted);
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.85); }
  }

  /* Headline */
  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 300;
    font-optical-sizing: auto;
    line-height: 0.95;
    letter-spacing: -0.025em;
    font-size: clamp(48px, 8vw, 80px);
  }
  .italic-em {
    font-style: italic;
    font-weight: 400;
    position: relative;
    display: inline-block;
  }

  .shimmer {
    background: linear-gradient(90deg, #d4d4d8 0%, #d4d4d8 40%, #43B581 50%, #d4d4d8 60%, #d4d4d8 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: shimmer 6s linear infinite;
  }

  @keyframes shimmer {
    0% { background-position: -200% 0; }
    100% { background-position: 200% 0; }
  }

  /* Subhead */
  .sub {
    margin: 24px auto 0;
    max-width: 512px;
    font-size: 16.5px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* Tagline */
  .tagline {
    margin-top: 48px;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12.5px;
    color: var(--text-faint);
  }
  .tagline-text {
    text-transform: uppercase;
    letter-spacing: 0.2em;
  }
  .tagline-line {
    height: 1px;
    width: 32px;
    background: rgba(255,255,255,0.1);
  }

  /* Footer */
  footer {
    position: relative;
    z-index: 10;
    padding: 0 24px 32px;
  }
  .footer-inner {
    max-width: 1024px;
    margin: 0 auto;
    text-align: center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--text-faint);
  }

  /* Reveal animation */
  .reveal {
    opacity: 0;
    transform: translateY(16px);
    animation: float-up 1s cubic-bezier(0.2, 0.7, 0.2, 1) forwards;
  }
  .delay-1 { animation-delay: 0.05s; }
  .delay-2 { animation-delay: 0.15s; }
  .delay-3 { animation-delay: 0.25s; }
  .delay-4 { animation-delay: 0.35s; }

  @keyframes float-up {
    to { opacity: 1; transform: translateY(0); }
  }

  @media (min-width: 1024px) {
    header { padding: 32px 40px 0; }
    main { padding: 64px 40px; }
    footer { padding: 0 40px 32px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <div class="page">
    <div class="grid-bg"></div>
    <div class="glow"></div>

    <header>
      <div class="header-inner">
        <div class="logo">
          <div class="logo-mark">C</div>
          <span class="logo-name">Career Draft</span>
        </div>
        <span class="est">Est. 2026</span>
      </div>
    </header>

    <main>
      <div class="container">
        <div class="reveal delay-1">
          <span class="eyebrow">
            <span class="pulse-wrap">
              <span class="pulse-outer"></span>
              <span class="pulse-inner"></span>
            </span>
            <span class="eyebrow-label">Coming soon</span>
          </span>
        </div>

        <h1 class="reveal delay-2">
          Jobs, <span class="italic-em"><span class="shimmer">with your odds.</span></span>
        </h1>

        <p class="sub reveal delay-3">
          A new kind of job board for early-career talent. Every listing comes with a match score for your CV — plus instant feedback on what to fix before you apply.
        </p>

        <div class="tagline reveal delay-4">
          <span class="tagline-line"></span>
          <span class="tagline-text">Launching soon</span>
          <span class="tagline-line"></span>
        </div>
      </div>
    </main>

    <footer>
      <div class="footer-inner">© 2026 Career Draft</div>
    </footer>
  </div>
</body>
</html>
